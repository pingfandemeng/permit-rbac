services:
  mysql:
    image: mysql:8.0
    container_name: permit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: permit
      MYSQL_USER: permit
      MYSQL_PASSWORD: permit123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
      --lower-case-table-names=1
    volumes:
      - permit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upermit", "-ppermit123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2
    container_name: permit-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - permit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  permit-mysql-data:
  permit-redis-data:
